# Production stack: Shipnod + Caddy (automatic HTTPS) + Litestream (continuous off-site backups).
#
#   cp deploy/env.production.example .env   # fill it in (see docs/07-deployment.md)
#   docker compose up -d --build
#
name: shipnod

x-backup-env: &backup-env
  BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?Set BACKUP_S3_BUCKET in .env}
  BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?Set BACKUP_S3_ENDPOINT in .env}
  BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
  BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?Set BACKUP_S3_ACCESS_KEY_ID in .env}
  BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?Set BACKUP_S3_SECRET_ACCESS_KEY in .env}
  BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-true}

services:
  # One-shot, before the app on every `docker compose up`:
  #  - on an empty server (new VPS, disk lost) it restores the database from the backup bucket;
  #  - when the database already exists it does nothing (no network call);
  #  - it gives the data volume to the app's user (uid 1000) — new Docker volumes start out owned by root.
  restore:
    image: litestream/litestream:0.3.13
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["litestream restore -if-db-not-exists -if-replica-exists /data/shipnod.db && chown -R 1000:1000 /data"]
    environment: *backup-env
    volumes:
      - shipnod-data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    restart: "no"

  app:
    build: .
    image: shipnod:latest
    restart: unless-stopped
    depends_on:
      restore: { condition: service_completed_successfully }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/shipnod.db
      PORT: "8787"
    volumes:
      - shipnod-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: local
      options: { max-size: 10m, max-file: "5" }

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: local
      options: { max-size: 10m, max-file: "5" }

  # Streams every database change to S3-compatible storage within seconds. Not optional: the database
  # holds sellers, orders and payments, and a VPS disk can die.
  litestream:
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy } # the app creates the database (as uid 1000) before replication starts
    user: "1000:1000"
    command: replicate
    environment: *backup-env
    volumes:
      - shipnod-data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    logging:
      driver: local
      options: { max-size: 10m, max-file: "5" }

volumes:
  shipnod-data:
  caddy-data:
  caddy-config:
