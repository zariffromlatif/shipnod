# Continuous replication of the SQLite database to S3-compatible storage
# (Cloudflare R2, Backblaze B2, AWS S3, MinIO…). Values come from .env via compose.yaml.
dbs:
  - path: /data/shipnod.db
    replicas:
      - type: s3
        bucket: ${BACKUP_S3_BUCKET}
        path: shipnod
        endpoint: ${BACKUP_S3_ENDPOINT}
        region: ${BACKUP_S3_REGION}
        access-key-id: ${BACKUP_S3_ACCESS_KEY_ID}
        secret-access-key: ${BACKUP_S3_SECRET_ACCESS_KEY}
        force-path-style: ${BACKUP_S3_FORCE_PATH_STYLE}
        # Point-in-time restore for the last 7 days; a fresh full snapshot every day.
        retention: 168h
        snapshot-interval: 24h
